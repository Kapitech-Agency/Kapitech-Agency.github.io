name: AMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kapitech_ams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kapitech_ams_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Apply PostgreSQL migrations
        env:
          KAPITECH_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kapitech_ams_test
          KAPITECH_POSTGRES_SSL: disable
        run: npm run db:migrate

      - name: Security regression tests
        run: npm test

      - name: PostgreSQL integration tests
        env:
          KAPITECH_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/kapitech_ams_test
          KAPITECH_POSTGRES_SSL: disable
        run: node --import tsx --test tests/postgres-integration.test.ts tests/postgres-domain-repositories.test.ts tests/postgres-time-log.test.ts tests/postgres-expense.test.ts

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        env:
          RAYON_NUM_THREADS: 1
        run: npm run build
